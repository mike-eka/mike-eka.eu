titel: "Lautleise Muster"
untertitel: "Desinformation jenseits von wahr und falsch"
kernsatz: >-
  Bestimmte Inhalte sind nicht per se (keine) Desinformation. Ob sie es sind, hängt auch davon ab,
  für wen, im Vergleich wozu und in welcher Hinsicht sie die Erkenntnislage
  verschlechtern.
# Übersicht: steht direkt unter dem Kernsatz
inhalt_hinweis: >-
  Was als Inhalt zählt, ist dabei oft mehr als ein einzelner Satz: eine
  Antwort im Verhältnis zur vorher gestellten Frage; eine Kombination von Aussagen; eine Auswahl und Gewichtung von Informationen; oder eine Aussage samt dem Netzwerk, in das sie
  eingebunden ist. Bei manchen Mustern liegt das Problem also nicht in einer
  einzelnen Information, sondern in ihrem Verhältnis zu anderen Informationen.
# Entwürfe (Karten mit veroeffentlicht: false) als „in Vorbereitung“ zeigen?
# false: Entwürfe erscheinen nirgends – nicht in Landkarte und Liste.
# Gebaut werden Entwürfe in keinem Fall.
entwuerfe_anzeigen: true

# Ein Absatz Haltung für die Übersicht
haltung: >-
  „Lautleise“ heißen diese Muster, weil sie leise wirken und doch laut werden,
  sobald man sie einmal kennt. Der Atlas sammelt Desinformationsmuster, die zwar
  ohne falsche Behauptung auskommen, dafür aber teilweise umso problematischer sind. Dieses Projekt exploriert die
  Arbeitsdefinition des DFG-Schwerpunktprogramms Re:DIS, nach der Desinformationen öffentlich verbreitete Informationen sind, die die Erkenntnisslage verschlechtern. Der Atlas entwickelt sich laufend weiter.

# Einleitung der Begriffsmodell-Seite (/atlas/begriffsmodell/)
begriffsmodell_einleitung: >-
  Dieses Begriffsmodell macht sichtbar, was alles für Entscheidungen und Präsuppositionen im Urteil
  „Das ist Desinformation“ stecken. Es behandelt Desinformation nicht als intrinsische, binäre
  Eigenschaft eines Inhalts, sondern als extrinsische Einschätzung, die sich aus dem Zusammenspiel mehrerer Faktoren ergibt: Ein Inhalt wird für
  ein Publikum, im Vergleich zu etwas und in einer bestimmten Hinsicht
  beurteilt. Die Muster des Atlas sind teilweise ausgefüllte Fassungen
  dieser Einschätzung. Jedes lässt eine Frage offen, und an ihr
  entscheidet sich der Befund.

# art: muster  – ein Muster kann diese Frage festlegen oder offenlassen;
#                nur diese Fragen sind als `kippt_an` (die Frage, an der der
#                Grenzfall einer Karte offen ist) erlaubt.
# art: rahmen  – stellt sich bei jeder Einschätzung (Publikum), kein
#                Merkmal eines Musters.
pruefragen:
  - id: was
    art: muster
    frage: "Was genau ist der Inhalt?"
    feld: inhalt
    erklaerung: >-
      Eine einzelne Aussage oder erst eine Antwort auf eine Frage, eine
      Erklärung, ein Paar von Aussagen, eine Auswahl oder ein Netzwerk. Manches ergibt erst zusammen eine desinformative Situation bzw. ein „Desinformationsobjekt“.
  - id: fuer_wen
    art: rahmen
    frage: "Für wen?"
    feld: publikum
    erklaerung: >-
      Welches Publikum, und wie viele dort betroffen sein müssen. Derselbe
      Satz kann für die einen harmlos sein und für die anderen nicht.
  - id: vergleich
    art: muster
    frage: "Im Vergleich wozu?"
    feld: vergleichsfall
    erklaerung: >-
      Mit der Lage vorher, ohne den Inhalt oder mit einer anderen
      Formulierung. Ohne Vergleich lässt sich nicht sagen, ob etwas
      schlechter wird.
  - id: hinsicht
    art: muster
    frage: "In welcher Hinsicht?"
    feld: hinsicht
    erklaerung: >-
      Was genau schlechter wird. Klassische Faktenchecks prüfen nur eine dieser
      Hinsichten.

# Abschnitt „Für wen?“ auf der Begriffsmodell-Seite (Schritt 3). Jede Karte
# verweist im Rahmen ihrer Schablone darauf (/atlas/begriffsmodell/#<anker>).
publikum_abschnitt:
  anker: fuer-wen # Sprungmarke; die Karten verlinken /atlas/begriffsmodell/#fuer-wen
  titel: "Für wen? Eine Frage, die sich immer stellt"
  einleitung: >-
    Wenn Desinformation als Information verstanden wird, die die Erkenntnislage verschlechtert, hängt es auch davon ab, wer den Inhalt aufnimmt, ob
    Desinformation vorliegt. Vorwissen, Vertrauen in die Quelle, Aufmerksamkeit
    und die Gruppe, in der man etwas hört, können ebenfalls die Wirkung verändern. Dieselbe Information kann für die einen harmlos sein und für die anderen nicht. Weil das
    für jedes Muster gilt, steht diese Frage nicht auf den einzelnen Karten,
    sondern hier: Sie ist der Rahmen jeder Einschätzung.
  aggregation:
    titel: "Wie viele müssen betroffen sein?"
    text: >-
      Ist ein Publikum gemischt, muss man daher entscheiden, wie man die Wirkung – also den desinformativen Effekt –
      zusammenfasst. Jede Antwort hat Folgen: Reicht es, dass einige
      schlechter dastehen, wäre fast jede politische Rede Desinformation.
      Müssen alle betroffen sein, fast keine. Das Begriffsmodell entscheidet
      diese Frage nicht, es macht sie sichtbar.
    optionen:
      - {
          name: "einige",
          text: "Es genügt, dass ein Teil des Publikums schlechter dasteht.",
        }
      - { name: "Mehrheit", text: "Die meisten müssen schlechter dastehen." }
      - { name: "alle", text: "Niemand darf besser oder gleich dastehen." }
      - {
          name: "Gewicht",
          text: "Es zählt, wie viele betroffen sind und wie stark.",
        }
  beispiel: >-
    „Tempo 30 macht unsere Innenstädte kaputt.“ Wer der Sprecherin vertraut,
    hält die Frage danach womöglich für entschieden. Wer ihr misstraut, hört
    eine Meinung. Für die einen hat sich die Erkenntnislage verschlechtert,
    für die anderen nicht.
  bezug: >-
    Für die Frage, welche Desinformation eine liberale Demokratie hinnehmen
    muss, ist das zentral. Dabei sollte sich der korrekte Maßstab meines Erachtens an den (tatsächlichen oder potenziellen) destruktiven Effekten einer Information richten.

hinsichten: # Reihenfolge = Reihenfolge in der Landkarte
  - id: glauben
    name: "Was wir glauben"
    erklaerung: "Welche Aussagen wir für wahr halten und wie sicher wir uns dabei sind."
    schwerpunkt: false
    hinweis: "Das klassische Feld der Faktenchecks"
  - id: achten
    name: "Worauf wir achten"
    erklaerung: "Worauf unsere Aufmerksamkeit gelenkt wird."
    schwerpunkt: true
  - id: vertrauen
    name: "Wem wir glauben"
    erklaerung: "Welchen Quellen wir Sachkenntnis zutrauen."
    schwerpunkt: true
  - id: begruenden
    name: "Warum wir glauben"
    erklaerung: "Aus welchen Gründen und nach welchen Maßstäben wir etwas für richtig halten."
    schwerpunkt: true

# Erlaubte Werte für `inhaltsart` einer Karte. Die Reihenfolge (von einfach
# zu vernetzt) ist die der Wertezeile unter „Was genau ist der Inhalt?“
# (Landkarte, Liste, Begriffsmodell). Englisch: en.yaml → inhaltsarten.
inhaltsarten:
  - "eine Aussage"
  - "eine Antwort auf eine Frage"
  - "eine Erklärung"
  - "ein Paar"
  - "eine Auswahl"
  - "ein Netzwerk"

# Arten des Vergleichsfalls. Jede Karte nennt ihre unter `vergleichsart` (Liste
# von ids). `kurz`: Kurzform für die leere Schablone (sonst der Name ohne
# Klammer). Legende V im Anhang und leere Schablone werden hieraus erzeugt.
vergleichsfaelle:
  - { id: vorher, name: "vorher" }
  - { id: ohne, name: "ohne den Inhalt" }
  - {
      id: alternative,
      name: "eine Alternative derselben Art (z. B. ein Minimalpaar)", #  : kein Umbruch in „z. B.“
      kurz: "Alternative derselben Art", #  : „derselben Art“ bleibt zusammen
    }

wirkungen:
  - {
      id: verschlechtern,
      name: "verschlechtern",
      erklaerung: "Die Erkenntnislage ist danach schlechter als vorher.",
    }
  - {
      id: festhalten,
      name: "festhalten",
      erklaerung: "Eine Erkenntnislage wird weder verbessert noch verschlechtert, sondern bleibt unverändert bestehen.",
    }
  - {
      id: abschotten,
      name: "abschotten",
      erklaerung: "Eine Erkenntnislage wird aktiv von potenzieller Verbesserung abgeschottet.",
    }

urteile:
  - { id: ja, name: "ja" }
  - { id: nein, name: "nein" }
  - { id: strittig, name: "strittig" }

# Begriffsmodell-Seite: was die Definition offenlässt
offen_gelassen:
  titel: "Was die Definition offenlässt: Wahrheit und Absicht"
  text: |
    Ob ein Inhalt wahr ist oder ob jemand täuschen will, spielt für die Re:DIS-Definition keine Rolle. Die im Zusammenhang von Desinformation vertrauten Konzepte ergeben sich bei ihr als Sonderfälle: Lüge ist falsch und mit Absicht; Fehlinformation falsch ohne Absicht; Irreführung mit Wahrem ist wahr und trotzdem schädlich. Darin folgt der Atlas Fallis (2015): Desinformation muss weder falsch sein noch auf einer Täuschungsabsicht beruhen. Von den zwei Mängeln, über die Jaster & Lanius (2019) Fake News bestimmen – fehlende Wahrheit und fehlende Wahrhaftigkeit –, greift der Atlas nur den ersten auf.

    Das hat zwei Vorteile. Erstens muss man niemandem in den Kopf schauen. Stattdessen beobachtet und misst man (sofern möglich) den epistemischen Effekt, den ein Inhalt auf sein Publikum hat. Zweitens erfasst die Re:DIS-Definition die politischen Funktionen von Desinformation, die die anderen Ansätze beschreiben, aber unzureichend abdecken (Zweifel säen, verunsichern, Vertrauen untergraben).

    Der Preis dafür ist allerdings, dass auch ehrliche Fehler (z. B. einer Redaktion) oder missverstandene Satire (z. B. The Onion) die Erkenntnislage ihrer Rezipienten verschlechtern können und somit potenzielle Fälle von Desinformation darstellen. Dies spricht dafür, dass Absichten doch in irgendeiner Form in die Begriffsbestimmung von Desinformation eingehen müssen.

    Auch Fallis scheint letztlich nicht ganz ohne sie auszukommen: Seine Definition verzichtet zwar auf eine Täuschungsabsicht, stützt sich aber auf den Begriff der Funktion. Was als Funktion einer Information gilt, hängt jedoch sowohl mit den Absichten ihres Senders als auch mit den Deutungen ihrer Rezipienten zusammen. Bei Lügen oder Propaganda bestimmt Fallis die Funktion sogar ausdrücklich über die Absicht der Urheber. Die Intention, die er aus der Definition verbannt, findet so durch die Hintertür wieder Einzug.

# Begriffsmodell-Seite: Literatur am Seitenende
literatur:
  - "Fallis, D. (2015). What is disinformation? Library Trends 63(3), 401–426. https://doi.org/10.1353/lib.2015.0014"
  - "Jaster, R. & Lanius, D. (2019). Die Wahrheit schafft sich ab. Wie Fake News Politik machen. Stuttgart: Reclam."

schablone_stufen: # welche Fälle die große Schablone auf der Begriffsmodell-Seite zeigt
  muster:
    meinung-als-tatsache # id einer Karte; ihre einschaetzungen werden die Beispiel-Stufen
    # (jede füllt das Feld aus `kippt_an` und das Urteil)

schablone_leer: # Texte der leeren Schablone
  # vergleichsfall: wird aus vergleichsfaelle erzeugt (Kurzformen, ohne Klammer);
  # eine eigene Zeile hier ersetzt das
  inhalt: ["Aussage · Antwort", "· Erklärung · Paar", "· Auswahl · Netzwerk"]
  publikum: ["Wer genau?", "Wie viele?"]
  urteil: ["ja · nein · strittig", ""]
  hinsicht: ["Was · Worauf · Wem ·", "Warum wir glauben"]
  wirkung: ["verschlechtern ·", "festhalten · abschotten"]

