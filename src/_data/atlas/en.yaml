# Englische Kurzfassung /en/atlas/ (übernommen aus docs/texte-schritt5.yaml).
# Im Template verfügbar als `atlas.en`. Die Muster erscheinen dort mit ihrem
# `fachbegriff` und verlinken auf die deutschen Karten.

titel: "Lautleise Muster: a small atlas of overlooked disinformation patterns"
einleitung: >-
  This atlas collects patterns of disinformation that rarely show up in fact
  checks, because they get by without a false statement. It follows the
  working definition of the DFG Priority Programme “Rethinking
  Disinformation” (Re:DIS), under which any publicly disseminated content
  can count as disinformation if it worsens its recipients' epistemic
  situation, regardless of its truth or the authors' intent. The atlas is a
  work in progress and an invitation to discussion.
kernsatz: >-
  Content is not disinformation in itself. Whether it is depends on for
  whom, compared to what, and in which respect it worsens the epistemic
  situation.
fragen:
  was: "What exactly is the content?"
  vergleich: "Compared to what?"
  hinsicht: "In which respect?"
  fuer_wen: "For whom? The frame of every assessment."
hinsichten:
  glauben: "What we believe"
  achten: "What we attend to"
  vertrauen: "Whom we trust"
  begruenden: "Why we believe"
  rand: "Do we believe it at all?"
muster_hinweis: "The individual pattern cards are available in German."

