# Englische Kurzfassung /en/atlas/ (übernommen aus docs/texte-schritt5.yaml).
# Im Template verfügbar als `atlas.en`. Die Muster erscheinen dort mit ihrem
# `fachbegriff` und verlinken auf die deutschen Karten.

titel: "Lautleise Muster: a small atlas of overlooked disinformation patterns"
# English for begriffsmodell.yaml → untertitel; shown below the title
untertitel: "Disinformation beyond true and false"
einleitung: >-
  They are called *lautleise* (‘loud-quiet’) because they work quietly, yet
  become loud once you know them. This atlas collects disinformation
  patterns that get by without a false statement but can be all the more
  problematic for it. It explores the working definition of the DFG Priority
  Programme “Rethinking Disinformation” (Re:DIS), under which
  disinformation is publicly disseminated information that worsens the
  epistemic situation. The atlas is a work in progress.
kernsatz: >-
  Some content is not in itself disinformation – or not disinformation.
  Whether it is depends, among other things, on for whom, compared to what
  and in which respect it worsens the epistemic situation.
# directly below the core sentence
inhalt_hinweis: >-
  What counts as content is often more than a single sentence: an answer in
  relation to the question, a pair of statements, a selection from many
  reports, or a statement together with the network it is embedded in. For
  several patterns, the problem lies not in a single piece of information
  but in its relation to others.
# English for each `inhaltsart` of the cards (keys: inhaltsarten in
# begriffsmodell.yaml, whose order is kept)
inhaltsarten:
  "eine Aussage": "a statement"
  "eine Antwort auf eine Frage": "an answer to a question"
  "eine Erklärung": "an explanation"
  "ein Paar": "a pair"
  "eine Auswahl": "a selection"
  "ein Netzwerk": "a network"
fragen:
  was: "What exactly is the content?"
  vergleich: "Compared to what?"
  hinsicht: "In which respect?"
  fuer_wen: "For whom? – the frame of every assessment"
hinsichten:
  glauben:
    name: "What we believe"
    erklaerung: "Which statements we take to be true, and how certain we are."
    hinweis: "The classic domain of fact-checking" # as begriffsmodell.yaml → hinweis
  achten:
    name: "What we attend to"
    erklaerung: "What our attention is directed to."
  vertrauen:
    name: "Whom we believe"
    erklaerung: "Which sources we credit with expertise."
  begruenden:
    name: "Why we believe"
    erklaerung: "On what grounds and by which standards we take something to be right."
muster_hinweis: "The individual pattern cards are available in German."

