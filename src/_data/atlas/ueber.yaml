# Texte der Seite /atlas/ueber/ (übernommen aus docs/texte-schritt5.yaml).
# Im Template verfügbar als `atlas.ueber`.

titel: "Über diesen Atlas"
entstehung: >-
  Der Atlas ist das Ergebnis verschiedener Ideen, die ich schon länger mit mir herumtrage. Die im Schwerpunktprogramm Re:DIS angeführte Arbeitsdefinitionhabe ich zum Anlass genommen, diese Ideen im Rahmen dieser Definition zu explorieren.
  Ich wollte sehen, wohin die Definition mich führt.
  Außerdem knüpft diseses Projekt an den Essay „Wahr oder falsch reicht nicht“ an, den ich mit Cassian
  Cassens geschrieben habe.
  Das Begriffsmodell kam später hinzu.
haltung: >-
  Das Projekt entwickelt sich laufend weiter, es ist keine fertige Theorie. Die Beispiele sind erfunden, damit es um Muster geht und
  nicht um Personen oder Parteien.
ki_hinweis: >-
  Bei der technischen Umsetzung dieses Atlas habe ich KI-Assistenzsysteme genutzt.
  Konzept, Beispiele und Texte verantworte ich selbst.
kontakt: "Kontakt und Anbieterangaben stehen im Impressum."
