# Texte der Seite /atlas/ueber/ (übernommen aus docs/texte-schritt5.yaml).
# Im Template verfügbar als `atlas.ueber`.

titel: "Über diesen Atlas"
entstehung: >-
  Der Atlas ist aus meiner ehrenamtlichen Arbeit bei Codetekt entstanden, wo
  ich wiederkehrende Desinformationsmuster sammle, und aus dem Essay „Wahr
  oder falsch reicht nicht“, den ich mit Cassian Cassens geschrieben habe.
  Das Begriffsmodell kam später hinzu. Anlass war die Arbeitsdefinition des
  DFG-Schwerpunktprogramms „Rethinking Disinformation“ (Re:DIS): Ich wollte
  verstehen, welche Entscheidungen in ihr stecken.
haltung: >-
  Beides ist ein Arbeitsstand und als Gesprächsangebot gemeint, nicht als
  fertige Theorie. Die Beispiele sind erfunden, damit es um Muster geht und
  nicht um Personen oder Parteien. Wer eine Einordnung für falsch hält, hat
  damit schon das getan, wofür der Atlas gedacht ist: eine der Stellschrauben
  anders gesetzt.
ki_hinweis: >-
  Bei der Erstellung dieses Atlas habe ich KI-Assistenzsysteme genutzt.
  Konzept, Beispiele und Texte verantworte ich selbst.
kontakt: "Kontakt und Anbieterangaben stehen im Impressum."
