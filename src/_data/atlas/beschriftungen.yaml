# Feste Beschriftungen der Atlas-Seiten: Überschriften, Knöpfe, Legenden.
# Inhalte stehen in begriffsmodell.yaml und in atlas/muster/*.md.
# Im Template verfügbar als `atlas.beschriftungen`.

uebersicht:
  link: "← Zur Übersicht"
  noch_keine_karten: "Noch keine Karten veröffentlicht."
  nicht_schwerpunkt: "nicht Schwerpunkt"

karte:
  schablone: "Was das Muster festlegt"
  effekt: "Was sich verschlechtert"
  effekt_vorher: "Vorher"
  effekt_nachher: "Nachher"
  effekt_hinsichten: "In Hinsicht"
  minimalpaar: "Minimalpaar"
  muster: "Muster"
  gegenform: "Gegenform"
  mittel: "Sprachliches Mittel"
  test: "Test"
  wirkung: "Wirkung"
  etiketten: "Etiketten"
  etiketten_hinweis: "Etiketten beschreiben den Inhalt. Sie sind keine Bedingung für Desinformation."
  normalfall: "Normal, weil"
  verwandt: "Verwandt"
  spiegelfall: "Spiegelfall"
  in_vorbereitung: "in Vorbereitung"
  anschlussfaecher: "Anschlussfächer"
  literatur: "Literatur"
  mehr: "Erläuterung"

schablone:
  mitte: "Einschätzung"
  # Legende über der Schablone
  legende: "Farbig: legt das Muster fest. Gestrichelt: lässt es offen."
  # Feld, an dem der Grenzfall kippt (`kippt_an`)
  stellschraube: "Stellschraube"
  schalter: "Einschätzung wählen"
  urteil_hinweis: "ergibt sich aus der Stellschraube"
  wirkung_keine: "keine"   # Einschätzung mit `wirkung: keine`
  # Rahmen „Publikum“ um die Schablone; der Link führt zu
  # begriffsmodell.publikum_abschnitt (Linktext = dessen Titel)
  publikum_verweis: "Rahmen jeder Einschätzung, kein Merkmal des Musters."
  felder:            # die Felder der Schablone (im Code angelegt)
    inhalt:         { frage: "Was?", name: "Inhalt" }
    publikum:       { frage: "Für wen?", name: "Publikum" }
    vergleichsfall: { frage: "Im Vergleich wozu?", name: "Vergleichsfall" }
    hinsicht:       { frage: "In welcher Hinsicht?", name: "Hinsicht" }
    urteil:         { name: "Urteil" }
    wirkung:        { name: "Wirkung" }
  # Status der Felder: für Screenreader und für weitere Legenden-Einträge
  # (belegt / fehlt erscheinen erst in der großen Schablone)
  status:
    offen: "offen"
    muster: "durch Muster festgelegt"
    belegt: "durch Beispiel belegt"
    fehlt: "fehlt"

etiketten:
  wahrheitsstatus: "Wahrheitsstatus"
  absicht: "Absicht"
