<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    html, body { margin: 0; background: #fffaf0; font-family: sans-serif; }
    .bar { fill: #bf5748; }
    .bar:hover { fill: black; }
    text { font-size: 12px; fill: #2a2620; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
</head>
<body>
<svg id="chart" width="100%" height="420"></svg>
<script>
  // Example D3 bar chart with placeholder data. Replace with your own data/logic.
  const data = [
    { word: "the", count: 42 },
    { word: "and", count: 31 },
    { word: "of", count: 27 },
    { word: "to", count: 19 },
    { word: "a", count: 14 },
  ];

  const svg = d3.select("#chart");
  const width = svg.node().clientWidth;
  const height = 420;
  const margin = { top: 20, right: 20, bottom: 30, left: 40 };

  const x = d3.scaleBand()
    .domain(data.map(d => d.word))
    .range([margin.left, width - margin.right])
    .padding(0.3);

  const y = d3.scaleLinear()
    .domain([0, d3.max(data, d => d.count)]).nice()
    .range([height - margin.bottom, margin.top]);

  svg.append("g")
    .selectAll("rect")
    .data(data)
    .join("rect")
    .attr("class", "bar")
    .attr("x", d => x(d.word))
    .attr("y", d => y(d.count))
    .attr("height", d => y(0) - y(d.count))
    .attr("width", x.bandwidth());

  svg.append("g")
    .attr("transform", `translate(0,${height - margin.bottom})`)
    .call(d3.axisBottom(x));

  svg.append("g")
    .attr("transform", `translate(${margin.left},0)`)
    .call(d3.axisLeft(y));
</script>
</body>
</html>
